; Interim mitigation for PHP2Shell (CVE-2026-109618/-109619) for PHP-FPM/CGI hosts.
; Not a fix - the hoster must run a patched PHP. Ignored under mod_php (see .htaccess).
; contact.php only receives a small text form, so a tiny body limit is enough.
post_max_size = 64K
session.upload_progress.enabled = 0
