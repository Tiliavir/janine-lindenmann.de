name: 🚀 Deploy website on tag
on:
  push:
    tags:
      - '*'
permissions:
  contents: write
jobs:
  build:
    if: github.event.base_ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
      - name: ↧ Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20.x
      - name: ↧ npm ci
        run: npm ci --ignore-scripts
      - name: 🔍 Lint
        run: npm run lint
      - name: ⚛ Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.139.0'
          extended: true
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: ⚙ Build
        run: npm run build
      - name: 🏷️ Get tag name
        run: echo "TAG_NAME=$(echo ${GITHUB_REF#refs/*/} | tr / -)" >> $GITHUB_ENV
      - name: 📂 Archive
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: release-diff
          folder: public
          clean: true
          commit-message: Release ${{ env.TAG_NAME }}
      - name: 🎉 Deploy
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: web27.alfahosting-server.de
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}
          protocol: ftps
          local-dir: ./public/
          server-dir: /
          security: loose
          port: 21
