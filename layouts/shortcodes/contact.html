<div class="form-outer band band--primary{{ if eq (.Get "headingLevel") "1" }} form-outer--page{{ end }}">
    {{- $level := .Get "headingLevel" | default "2" }}
    <div class="form-outer__intro fx-up">
        {{ printf "<h%s>Ich freue mich auf eure Anfrage!</h%s>" $level $level | safeHTML }}
        <a class="form-outer__whatsapp" href="https://wa.me/4915679604716" target="_blank" rel="noopener">Per WhatsApp schreiben</a>
    </div>
    <form id="contactForm" class="contact-form">
        <div class="contact-form__field">
            <label for="name">Eure Namen</label>
            <input type="text" id="name" name="name" maxlength="100" class="accent" autocomplete="name" required>
        </div>
        <div class="contact-form__field">
            <label for="residence">Wohnort</label>
            <input type="text" id="residence" maxlength="100" name="residence" class="accent" autocomplete="address-level2">
        </div>
        <div class="contact-form__field">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" class="accent" autocomplete="email" required>
        </div>
        <div class="contact-form__field">
            <label for="ceremony">Art der Zeremonie</label>
            <select id="ceremony" name="ceremony" class="accent" required>
                <option value="" disabled selected>Bitte wählen</option>
                <option value="freie-trauung">Freie Trauung</option>
                <option value="kinderwillkommensfest">Kinderwillkommensfest</option>
            </select>
        </div>
        <div class="contact-form__field">
            <label for="date">Datum der Zeremonie</label>
            <input type="date" id="date" name="date" class="accent">
        </div>
        <div class="contact-form__field">
            <label for="location">Ort der Zeremonie</label>
            <input type="text" id="location" maxlength="100" name="location" class="accent">
        </div>
        <div class="contact-form__field contact-form__field--wide">
            <label for="message">Eure Nachricht an mich</label>
            <textarea maxlength="2000" id="message" name="message" class="accent" required></textarea>
        </div>

        <label for="msg" style="display:none">Website (bitte leer lassen)</label>
        <input maxlength="2000" id="msg" type="text" name="website" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit" class="accent">Absenden</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (document.getElementById("contactForm") == null) {
            return;
        }

        document.getElementById('contactForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            let responseBox = form.querySelector('.message-box');
            if (!responseBox) {
                responseBox = document.createElement('div');
                responseBox.classList.add('message-box');
                responseBox.setAttribute('role', 'status');
                responseBox.setAttribute('aria-live', 'polite');
                form.appendChild(responseBox);
            }

            responseBox.style.display = 'none';
            responseBox.className = 'message-box';
            responseBox.innerText = '';

            try {
                const res = await fetch('/contact.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data.success) {
                    responseBox.className = 'message-box success';
                    responseBox.innerText = data.message;
                    form.reset();
                } else {
                    responseBox.className = 'message-box error';
                    responseBox.innerText = data.errors ? data.errors.join('\n') : data.message;
                }
            } catch (err) {
                console.error('Kontaktformular konnte nicht gesendet werden:', err);
                responseBox.className = 'message-box error';
                responseBox.innerText = 'Verbindungsfehler – bitte erneut versuchen.';
            } finally {
                responseBox.style.display = 'block';
            }
        });

        // set default date to today
        const dateField = document.getElementById("date");
        dateField.setAttribute("value", new Date().toISOString().split('T')[0]);

        // add and set check field
        const jsField = document.createElement('input');
        jsField.type = 'hidden';
        jsField.name = 'jscheck';
        jsField.value = '1';
        document.getElementById('contactForm').appendChild(jsField);

        // CSRF-Token setzen (Double-Submit via Cookie + hidden field)
        const csrfToken = [...crypto.getRandomValues(new Uint8Array(16))]
            .map(b => b.toString(16).padStart(2, '0')).join('');
        document.cookie = 'csrf_token=' + csrfToken + '; SameSite=Strict; path=/';
        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = 'csrf_token';
        csrfInput.value = csrfToken;
        document.getElementById('contactForm').appendChild(csrfInput);
    });
</script>
